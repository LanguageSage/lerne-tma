[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lerne-tma-core"
version = "0.1.1"
description = "Shared Lerne API models and services; stage-one editable integration"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["api/requirements.txt"]}

[tool.setuptools.packages.find]
include = ["api", "api.*", "local"]
exclude = ["api.data", "api.data.*", "api.scratch", "api.scratch.*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"api.services.classifier" = ["data/*.json"]
local = ["compose.yaml"]
