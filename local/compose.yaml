name: lerne-tma-local
services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: lerne_tma_local
      POSTGRES_USER: lerne_local
      POSTGRES_PASSWORD: ${LERNE_PG_PASSWORD:?Use scripts/local_dev.py}
    ports:
      - "127.0.0.1:${LERNE_PG_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lerne_local -d lerne_tma_local"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
    name: lerne_tma_local_pgdata
