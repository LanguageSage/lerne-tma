[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "lerne-card-core"
version = "0.1.3"
description = "Pure JSON V2 validation and legacy card conversion shared by Lerne projects"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.9,<3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lerne_card_core*"]

[tool.setuptools.package-data]
lerne_card_core = ["provenance.json"]
