import java.security.MessageDigest

apply plugin: 'com.android.application'

def rawAbisProp = (project.findProperty('lerneAbis') ?: System.getenv('LERNE_ANDROID_ABIS') ?: 'arm64-v8a').toString()
def resolvedAbis = rawAbisProp.split(',').collect { it.trim() }.findAll { !it.isEmpty() }
if (resolvedAbis.isEmpty()) {
    resolvedAbis = ['arm64-v8a']
}
def allowedAbis = ['arm64-v8a', 'x86_64', 'armeabi-v7a', 'x86'] as Set
resolvedAbis.each { abi ->
    if (!allowedAbis.contains(abi)) {
        throw new GradleException("Unsupported Android ABI '${abi}' in lerneAbis/LERNE_ANDROID_ABIS. Allowed: ${allowedAbis.join(', ')}")
    }
}

def resolvePiperLibsDir = { ->
    def explicit = project.findProperty('lernePiperLibsDir') ?: System.getenv('LERNE_PIPER_LIBS_DIR')
    if (explicit != null && !explicit.toString().trim().isEmpty()) {
        return file(explicit.toString().trim())
    }
    def localLibs = file('libs')
    if (new File(localLibs, 'sherpa-onnx-2.0.3.aar').isFile()) {
        return localLibs
    }
    File cursor = rootProject.projectDir
    for (int depth = 0; depth < 6 && cursor != null; depth++) {
        File candidate = new File(cursor, 'data/tts/piper/android-libs')
        if (candidate.isDirectory()) {
            return candidate
        }
        cursor = cursor.parentFile
    }
    return localLibs
}
def piperLibsDir = resolvePiperLibsDir()
def sherpaOnnxAar = new File(piperLibsDir, 'sherpa-onnx-2.0.3.aar')
def piperPhonemizeAar = new File(piperLibsDir, 'piper-phonemize-1.6.1.aar')
def expectedAarSha256 = [
    (sherpaOnnxAar): '4c766e2e74c9d33d595338c21fe3b305c73ba45d47e96a235675c33142a2ec50',
    (piperPhonemizeAar): 'e8cf1b31c85a199f3258144bc5c4c23b1ce942c3e5ed7fea7dd0d4227980e285',
]

def piperAssetsDirProp = (project.findProperty('lernePiperAssetsDir') ?: System.getenv('LERNE_PIPER_ASSETS_DIR') ?: '').toString().trim()

def versionPropsFile = file('../version.properties')
def versionProps = new Properties()
if (versionPropsFile.isFile()) {
    versionPropsFile.withInputStream { stream ->
        versionProps.load(stream)
    }
}

def defaultVersionCode = (versionProps.getProperty('VERSION_CODE') ?: '1').trim().toInteger()
def defaultVersionName = (versionProps.getProperty('VERSION_NAME') ?: '1.0.0-offline-pilot').trim()

def pilotVersionCodeProp = project.findProperty('lernePilotVersionCode')
def pilotVersionNameProp = project.findProperty('lernePilotVersionName')

def resolvedVersionCode = (pilotVersionCodeProp != null && pilotVersionCodeProp.toString().trim())
    ? pilotVersionCodeProp.toString().trim().toInteger()
    : defaultVersionCode
def resolvedVersionName = (pilotVersionNameProp != null && pilotVersionNameProp.toString().trim())
    ? pilotVersionNameProp.toString().trim()
    : defaultVersionName

def readSigningSetting = { String propName, String envName, boolean trimValue ->
    def propVal = project.findProperty(propName)
    if (propVal != null) {
        def text = propVal.toString()
        if (trimValue ? !text.trim().isEmpty() : !text.isEmpty()) {
            return trimValue ? text.trim() : text
        }
    }
    def envVal = System.getenv(envName)
    if (envVal != null) {
        if (trimValue ? !envVal.trim().isEmpty() : !envVal.isEmpty()) {
            return trimValue ? envVal.trim() : envVal
        }
    }
    return null
}

def releaseKeystorePath = readSigningSetting('LERNE_KEYSTORE_PATH', 'LERNE_KEYSTORE_PATH', true)
def releaseStorePass = readSigningSetting('LERNE_KEYSTORE_STORE_PASS', 'LERNE_KEYSTORE_STORE_PASS', false)
def releaseKeyAlias = readSigningSetting('LERNE_KEYSTORE_ALIAS', 'LERNE_KEYSTORE_ALIAS', true)
def releaseKeyPass = readSigningSetting('LERNE_KEYSTORE_KEY_PASS', 'LERNE_KEYSTORE_KEY_PASS', false) ?: releaseStorePass
def releaseKeystoreFile = releaseKeystorePath ? file(releaseKeystorePath) : null
def hasReleaseSigningConfig = Boolean.valueOf(
    releaseKeystoreFile != null &&
    releaseKeystoreFile.isFile() &&
    releaseStorePass != null &&
    releaseKeyAlias != null &&
    releaseKeyPass != null
)

android {
    namespace = "com.lerne.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.lerne.offlinepilot"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        manifestPlaceholders = [appName: "Lerne Offline Pilot"]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters.addAll(resolvedAbis)
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
            noCompress 'onnx'
        }
    }
    sourceSets {
        main {
            if (!piperAssetsDirProp.isEmpty()) {
                def extraAssetsDir = file(piperAssetsDirProp)
                if (!extraAssetsDir.isDirectory()) {
                    throw new GradleException("Bundled Piper assets directory not found: ${extraAssetsDir}")
                }
                assets.srcDirs += extraAssetsDir
            }
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigningConfig) {
                storeFile releaseKeystoreFile
                storePassword releaseStorePass
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPass
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigningConfig) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

def verifyReleaseSigningConfig = tasks.register('verifyReleaseSigningConfig') {
    doLast {
        def missing = []
        if (!releaseKeystorePath) missing << 'LERNE_KEYSTORE_PATH'
        if (!releaseStorePass) missing << 'LERNE_KEYSTORE_STORE_PASS'
        if (!releaseKeyAlias) missing << 'LERNE_KEYSTORE_ALIAS'
        if (!missing.isEmpty()) {
            throw new GradleException(
                "Release signing is required for release APK/AAB builds (fail-closed). " +
                "Missing required Gradle property or environment variable(s): ${missing.join(', ')}. " +
                "Set LERNE_KEYSTORE_PATH, LERNE_KEYSTORE_STORE_PASS, LERNE_KEYSTORE_ALIAS " +
                "(and optional LERNE_KEYSTORE_KEY_PASS)."
            )
        }
        if (releaseKeystoreFile == null || !releaseKeystoreFile.isFile()) {
            throw new GradleException(
                "Release keystore file does not exist: ${releaseKeystorePath}"
            )
        }
    }
}

tasks.matching {
    it.name in ['preReleaseBuild', 'packageRelease', 'assembleRelease', 'bundleRelease', 'packageReleaseBundle', 'signReleaseBundle']
}.configureEach {
    dependsOn(verifyReleaseSigningConfig)
}

def verifyStandaloneAndroidWebBundle = tasks.register('verifyStandaloneAndroidWebBundle') {
    doLast {
        def indexFile = file('src/main/assets/public/index.html')
        if (!indexFile.isFile()) {
            throw new GradleException(
                "Missing synced Android Offline Pilot web bundle at ${indexFile}. " +
                "Run Vite build with VITE_LERNE_STANDALONE=1 and 'npx cap sync android' first."
            )
        }
        def html = indexFile.getText('UTF-8')
        if (!html.contains('name="lerne-android-mode" content="offline-pilot"') || html.contains('telegram.org')) {
            throw new GradleException(
                "Android APK builds only support Offline Pilot (VITE_LERNE_STANDALONE=1). " +
                "Legacy Standard Android builds have been removed; rebuild web assets with VITE_LERNE_STANDALONE=1 and run 'npx cap sync android'."
            )
        }
    }
}

tasks.matching {
    it.name in ['packageDebug', 'packageRelease', 'assembleDebug', 'assembleRelease', 'bundleDebug', 'bundleRelease']
}.configureEach {
    dependsOn(verifyStandaloneAndroidWebBundle)
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

def verifyPiperNativeLibs = tasks.register('verifyPiperNativeLibs') {
    doLast {
        expectedAarSha256.each { File aarFile, String expectedHex ->
            if (!aarFile.isFile()) {
                throw new GradleException(
                    "Missing required Piper Android library: ${aarFile}. " +
                    "Place verified AARs in data/tts/piper/android-libs or pass -PlernePiperLibsDir=<dir>."
                )
            }
            MessageDigest digest = MessageDigest.getInstance('SHA-256')
            aarFile.withInputStream { stream ->
                byte[] buf = new byte[65536]
                int read
                while ((read = stream.read(buf)) != -1) {
                    digest.update(buf, 0, read)
                }
            }
            String actualHex = digest.digest().encodeHex().toString().toLowerCase()
            if (actualHex != expectedHex) {
                throw new GradleException(
                    "SHA-256 mismatch for ${aarFile.name}: expected ${expectedHex}, got ${actualHex}"
                )
            }
        }
    }
}

tasks.matching {
    it.name in ['packageDebug', 'packageRelease', 'assembleDebug', 'assembleRelease', 'bundleDebug', 'bundleRelease']
}.configureEach {
    dependsOn(verifyPiperNativeLibs)
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    if (sherpaOnnxAar.isFile() && piperPhonemizeAar.isFile()) {
        implementation files(sherpaOnnxAar, piperPhonemizeAar)
    }
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
