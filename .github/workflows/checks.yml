name: Regression checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  database-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: security_fixture_admin
          POSTGRES_PASSWORD: local-security-fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U security_fixture_admin" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - name: Verify PostgreSQL ACL, RLS, defaults, rollback and HTTP flows
        env:
          LERNE_SECURITY_TEST_PASSWORD: local-security-fixture
        run: python scripts/test_supabase_security.py --disposable --port 5432 --bootstrap-user security_fixture_admin
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            requirements-test.txt
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix app ci
          python -m pip install -r requirements-test.txt
          npx --no-install playwright install --with-deps chromium
      - name: Run the same gate as local development
        run: npm run check
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
