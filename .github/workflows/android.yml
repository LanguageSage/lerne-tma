name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'APK build mode'
        required: true
        default: 'offline-pilot'
        type: choice
        options:
          - offline-pilot
          - standard
      build_upgrade_test_pair:
        description: 'For offline-pilot: build both v1 and v2 APKs signed with the same debug keystore for upgrade testing'
        required: false
        default: true
        type: boolean

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build-android:
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm --prefix app install --legacy-peer-deps

      - name: Build Web Application
        env:
          VITE_LERNE_STANDALONE: ${{ (inputs.build_mode || 'offline-pilot') == 'offline-pilot' && '1' || '0' }}
        run: |
          npm --prefix app run build

      - name: Sync Capacitor Android
        env:
          CAPACITOR_VERBOSE_LOGGING: 'true'
        run: |
          npx cap sync android

      - name: Build Standard Android Debug APK
        if: ${{ (inputs.build_mode || 'offline-pilot') == 'standard' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Build Offline Pilot Android Debug APK (v1 + optional v2 upgrade pair)
        if: ${{ (inputs.build_mode || 'offline-pilot') == 'offline-pilot' }}
        run: |
          mkdir -p dist-apk
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PlerneOfflinePilot=true -PlernePilotVersionCode=1 -PlernePilotVersionName=1.0.0-offline-pilot
          cp app/build/outputs/apk/debug/app-debug.apk ../dist-apk/lerne-offline-pilot-v1-debug.apk
          if [ "${{ inputs.build_upgrade_test_pair }}" != "false" ]; then
            ./gradlew assembleDebug --no-daemon -PlerneOfflinePilot=true -PlernePilotVersionCode=2 -PlernePilotVersionName=1.0.1-offline-pilot
            cp app/build/outputs/apk/debug/app-debug.apk ../dist-apk/lerne-offline-pilot-v2-debug.apk
          fi
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Upload Standard Debug APK Artifact
        if: ${{ (inputs.build_mode || 'offline-pilot') == 'standard' }}
        uses: actions/upload-artifact@v4
        with:
          name: Lerne-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Offline Pilot Debug APK Artifact
        if: ${{ (inputs.build_mode || 'offline-pilot') == 'offline-pilot' }}
        uses: actions/upload-artifact@v4
        with:
          name: Lerne-Offline-Pilot-Debug-APK
          path: dist-apk/*.apk
